name: "Champion's Report - Cloudflare Pages Deployment"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: "Deploy Automatico su Cloudflare Pages"
    
    steps:
      - name: "Fase 1: Controllo Checkout del Repository"
        uses: actions/checkout@v4

      - name: "Fase 2: Setup dell'ambiente Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Fase 3: Pubblicazione e Deploy tramite Wrangler"
        uses: cloudflare/wrangler-action@3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=champions-report --branch=main